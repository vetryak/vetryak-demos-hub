[project]
name = "ge-05-analista-dados"
version = "0.1.0"
description = "Demo Vetryak: analista de dados conversacional (ADK + BigQuery) para o Gemini Enterprise"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.14",
  "google-cloud-bigquery>=3.25",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
