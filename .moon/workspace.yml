# yaml-language-server: $schema=https://moonrepo.dev/schemas/workspace.json
# Workspace do vetryak-demos-hub.
# Cada demo é um projeto moon (uma "vertical slice") em demos/<contexto>/<demo>.
# Os globs apontam para moon.yml para que pastas de contexto (só README) não virem projetos.
projects:
  - "demos/*/*/moon.yml"
  - "shared/*/moon.yml"

vcs:
  defaultBranch: "main"
  provider: "github"

generator:
  templates:
    - "./templates"
