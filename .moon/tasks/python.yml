# yaml-language-server: $schema=https://moonrepo.dev/schemas/tasks.json
# Tarefas herdadas por projetos com a tag "python" (agentes ADK em agent/).
inheritedBy:
  tags: ["python"]

tasks:
  lint:
    command: "uvx ruff check agent"
    inputs: ["agent/**/*.py", "pyproject.toml"]
    toolchains: ["system"]
  format-check:
    command: "uvx ruff format --check agent"
    inputs: ["agent/**/*.py"]
    toolchains: ["system"]
